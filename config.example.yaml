# Nostalgia Line configuration. Copy to config.yaml and fill in.
# Nearly all of this is editable in the web UI - you should not need to hand-edit it.

source: plex                           # plex | jellyfin

plex:
  url: http://192.168.1.245:32400     # host IP; Plex binds host network in Docker
  token: ""                            # X-Plex-Token
  libraries: []                        # opt-in per library, e.g. [Shows, Movies]. [] = all.

jellyfin:
  url: http://192.168.1.245:8096
  api_key: ""                          # Dashboard > Advanced > API Keys
  user_id: ""                          # optional; an admin is picked automatically
  libraries: []                        # opt-in per library. [] = all.

tmdb:
  api_key: ""                          # same key Kometa uses
  rate_limit: 50                       # requests/sec. TMDB's documented ceiling.

routing:
  mode: streaming_first                # streaming_first | hybrid | themed
  multi_channel: sanctioned_pairs_only # off | sanctioned_pairs_only | permissive
  orphan_network: parent_fallback      # parent_fallback | content_type | flag_only

output:
  additions_only: channels_additions.csv
  merged: channels_merged.csv

data:
  channels_csv: data/channels.csv       # the NostalgiaTV defaults you are adding to
  network_map: data/network_map.csv
  orphan_networks: data/orphan_networks.csv
  channel_catalog: data/channel_catalog.csv
  cache_dir: .cache
  state_file: state.json

server:
  host: 127.0.0.1
  port: 8777
