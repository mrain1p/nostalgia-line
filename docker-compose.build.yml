# Build from source instead of pulling the published image.
#   docker compose -f docker-compose.build.yml up -d --build

services:
  nostalgia-line:
    build: .
    image: nostalgia-line:local
    container_name: nostalgia-line
    ports:
      - "8777:8777"
    volumes:
      - ./config:/config
    environment:
      - TZ=America/New_York
      # Optional. Without one the app is open on your LAN, which is the default.
      # - NOSTALGIA_PASSWORD=something-long
    # user: "1000:1000"
    restart: unless-stopped
